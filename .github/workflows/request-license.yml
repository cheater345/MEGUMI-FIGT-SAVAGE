name: Request Unity License

on:
  workflow_dispatch:

jobs:
  request-activation:
    name: Generate activation file (cloud, no PC needed)
    runs-on: ubuntu-latest
    steps:
      - name: Generate manual activation file (.alf)
        run: |
          docker run --rm \
            -v "$PWD":/tmp/project \
            unityci/editor:ubuntu-6000.0.81f1-base-3.2.2 \
            bash -c "cd /tmp/project && unity-editor -batchmode -nographics -quit -createManualActivationFile -projectPath /tmp/project -logFile - || true"
        timeout-minutes: 30

      - name: Upload manual activation file
        uses: actions/upload-artifact@v4
        with:
          name: ManualActivationFile
          path: ./Unity_v6000.0.81f1.alf
          if-no-files-found: error

      - name: Print instructions
        run: |
          echo "1. Download the ManualActivationFile artifact from this run."
          echo "2. Open https://license.unity3d.com/manual on your phone browser."
          echo "3. Upload the .alf file and complete the form."
          echo "4. Download the returned .ulf file and copy its ENTIRE text content."
          echo "5. In the repo: Settings > Secrets and variables > Actions > New repository secret."
          echo "   Name: UNITY_LICENSE  Value: paste the whole .ulf content."
          echo "6. Run the 'Build' workflow - it will now build the APKs."