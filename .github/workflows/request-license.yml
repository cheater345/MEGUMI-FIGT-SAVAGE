name: Request Unity License

on:
  workflow_dispatch:

jobs:
  request-activation:
    name: Generate activation file
    runs-on: ubuntu-latest
    steps:
      - name: Request manual activation file
        id: getManualLicense
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.0.23f1

      - name: Upload manual activation file
        uses: actions/upload-artifact@v4
        with:
          name: ManualActivationFile
          path: ${{ steps.getManualLicense.outputs.artifactPath }}
          if-no-files-found: error

      - name: Print instructions
        run: |
          echo "Step 1: Download the ManualActivationFile artifact from this run."
          echo "Step 2: Open https://license.unity3d.com/manual on your phone/PC browser."
          echo "Step 3: Upload the .alf file, complete the form, download the .ulf license file."
          echo "Step 4: Copy the ENTIRE text content of the .ulf file."
          echo "Step 5: Add it as the UNITY_LICENSE secret:"
          echo "      Settings > Secrets and variables > Actions > New repository secret."
          echo "Step 6: Re-run the 'Build' workflow - it will then build the APKs."
          echo
          echo "License file name pattern: Unity_v6000.0.23f1.alf (in the artifact zip)"