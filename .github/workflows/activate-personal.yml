name: Activate Unity Personal License

on:
  workflow_dispatch:

jobs:
  activate:
    name: Browser-activate Personal license
    runs-on: ubuntu-latest
    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      UNITY_TOTP_KEY: ${{ secrets.UNITY_TOTP_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate .alf activation request file
        run: |
          set +e
          docker run --rm \
            -v "$PWD":/tmp/project \
            unityci/editor:ubuntu-6000.0.81f1-base-3.2.2 \
            bash -c '
              set +e
              cd /tmp/project
              unity-editor -batchmode -nographics -quit \
                -createManualActivationFile \
                -logFile - 2>&1 | tail -8
              ls -la *.alf 2>/dev/null
            ' | tee alf-gen.log
          ls -la *.alf 2>/dev/null
          exit 0
        timeout-minutes: 30

      - name: Install puppeteer-core
        run: |
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@23 --no-audit --no-fund 2>&1 | tail -2

      - name: Browser-activate Personal license (with debug dumps)
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: |
          set +e
          ls -la /usr/bin/google-chrome* 2>/dev/null
          ALF=$(ls Unity_*.alf | head -1)
          echo "Using $ALF"
          node scripts/activate-license.cjs "$ALF" 2>&1 | tail -120
          echo "--- ulf files ---"
          ls -la *.ulf 2>/dev/null
          echo "--- exit was $? ---"
          exit 0
        timeout-minutes: 20

      - name: Upload debug dumps and license as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: activation-dumps
          path: |
            page_*.html
            page_*.png
            *.ulf
            alf-gen.log
            scripts/activate-license.cjs
          if-no-files-found: ignore

      - name: Print next steps
        run: |
          if ls *.ulf >/dev/null 2>&1; then
            echo "SUCCESS: a .ulf license file was produced and uploaded in activation-dumps."
            echo "1. Download the activation-dumps artifact, open the .ulf file as text and copy ALL contents."
            echo "2. Settings > Secrets > New repository secret: UNITY_LICENSE"
            echo "3. Paste the full contents (it is a single long line)."
            echo "4. Run the Build workflow."
          else
            echo "NO .ulf was produced. The dump files (page_*.html/png) in the activation-dumps artifact show exactly what the page displayed."
            echo "Paste the log output here so we can fix it."
          fi
